<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro simples</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>
    <main>
        <h1>Cadastro simples</h1>
        <p>Preencha seus dados e conte um pouco sobre você.</p>
        <p>Os campos com * são obrigatórios.</p>

        <form id="cadastro">
            <fieldset>
                <legend>1. Dados Pessoais</legend>
                <div class="campo">
                    <label for="nome">Nome completo *</label>
                    <input type="text" id="nome" name="nome" minlength="10" autocomplete="name" required
                        aria-describedby="dica-nome">
                    <small id="dica-nome">Digite pelo menos 10 caracteres.</small>
                </div>
                <div class="campo">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>
                <div class="campo">
                    <label for="nascimento">Data de nascimento *</label>
                    <input type="date" id="nascimento" name="nascimento" max="2026-09-09" autocomplete="bday" required>
                </div>
                <div class="campo">
                    <label for="cpf">CPF *</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                </div>
                <div class="campo">
                    <label for="celular">Celular *</label>
                    <input type="tel" id="celular" name="celular" placeholder="(65) 99999-9999" autocomplete="tel"
                        required>
                </div>
            </fieldset>

            <fieldset>
                <legend>2. Perfil e Interesses</legend>
                <div class="campo">
                    <label for="interesse">Área de interesse *</label>
                    <select id="interesse" name="interesse" required>
                        <option value="">Selecione uma área</option>
                        <option value="programacao">Programação</option>
                        <option value="bancodedados">Banco de Dados</option>
                        <option value="redes">Redes de Computadores</option>
                        <option value="desenvolvimentomobile">Desenvolvimento Mobile</option>
                        <option value="cienciadedados">Ciência de Dados</option>
                    </select>
                </div>
                <div class="campo" role="group" aria-labelledby="titulo-experiencia"
                    aria-describedby="dica-experiencia">
                    <p id="titulo-experiencia">Nível de experiência</p>

                    <label class="opcao" for="iniciante">
                        <input type="checkbox" id="iniciante" name="experiencia" value="iniciante" checked> Iniciante
                    </label>
                    <label class="opcao" for="intermediario">
                        <input type="checkbox" id="intermediario" name="experiencia" value="intermediario">
                        Intermediário
                    </label>
                    <label class="opcao" for="avancado">
                        <input type="checkbox" id="avancado" name="experiencia" value="avancado"> Avançado
                    </label>
                </div>
                <div class="campo">
                    <label for="biografia">Biografia</label>
                    <textarea id="biografia" name="biografia" rows="5"
                        placeholder="Conte um pouco sobre seus estudos e interesses."></textarea>
                </div>
            </fieldset>

            <fieldset>
                <legend>3. Redes Sociais</legend>
                <div class="campo">
                    <label for="instagram">Link do Instagram</label>
                    <input type="url" id="instagram" name="instagram"
                        placeholder="https://www.instagram.com/seuusuario">
                </div>
                <div class="campo">
                    <label for="github">Link do GitHub</label>
                    <input type="url" id="github" name="github" placeholder="https://github.com/seuusuario">
                </div>
            </fieldset>

            <label class="opcao" for="termos">
                <input type="checkbox" id="termos" name="termos" required aria-describedby="termos-descricao"> Aceito os
                termos e condições. *
            </label>
            <label class="opcao" for="newsletter">
                <input type="checkbox" id="newsletter" name="newsletter"> Aceito receber a newsletter (opcional).
            </label>
            <div class="acoes">
                <button type="submit">Enviar cadastro</button>
                <button type="reset">Limpar formulário</button>
            </div>
            <p id="mensagem" role="status"></p>
        </form>
    </main>
</body>

</html>
